}

// ================= Lógica de negocio =================
function eventTotal(ev){
  const subtotal = sum(ev.lines.filter(l=>l.included).map(l=>l.qty*l.unitPrice));
  const disc = subtotal * (Number(ev.discount)||0) / 100;
  return round(subtotal - disc);
}
function eventSubtotal(ev){return sum(ev.lines.filter(l=>l.included).map(l=>l.qty*l.unitPrice));}
function eventPaid(evId){return sum(S.payments.filter(p=>p.eventId===evId&&!p.void).map(p=>p.amount));}
function eventBalance(ev){return round(eventTotal(ev) - eventPaid(ev.id));}
function eventDeposit(ev){return round(eventTotal(ev) * (S.settings.depositPct/100));}
function eventState(ev){
  if(ev.status==='Cancelada') return 'Cancelada';
  const total=eventTotal(ev), paid=eventPaid(ev.id), dep=eventDeposit(ev);
  if(paid >= total - 0.01){
    if(ev.eventDate && ev.eventDate < todayStr()) return 'Finalizado';
    return 'Pagado';
  }
  if(paid >= dep - 0.01) return 'Reservado';
  if(paid > 0) return 'Abono parcial';
  return 'Cotización';
}
function statePill(st){
  const map={'Cotización':'warn','Abono parcial':'warn','Reservado':'blue','Pagado':'good','Finalizado':'good','Cancelada':'bad'};
  return `<span class="pill ${map[st]||''}">${st}</span>`;
}
function nextCode(){
  const nums = S.events.map(e=>{const m=String(e.code||'').match(/(\d+)$/); return m?parseInt(m[1]):0;});
  const n = (nums.length?Math.max(...nums):0) + 1;
  return S.settings.prefix + String(n).padStart(3,'0');
}
function paymentCode(eventCode){return 'PAGO-'+eventCode;}
function inventoryValue(){return sum(S.inventory.map(i=>i.qty*i.unitCost));}
function clientName(id){return S.clients.find(c=>c.id===id)?.name || '—';}
function packageById(id){return S.packages.find(p=>p.id===id);}
function eventById(id){return S.events.find(e=>e.id===id);}

function alertsList(){
  const items=[];
  S.events.forEach(e=>{
    const st = eventState(e);
    if(st==='Cancelada'||st==='Finalizado') return;
    if(st==='Cotización') items.push({t:'warn', msg:`${e.code} · Sin abono. Reserva pendiente.`});
    else if(e.eventDate && e.eventDate<todayStr() && eventBalance(e)>0) items.push({t:'bad', msg:`${e.code} · Evento pasado con saldo ${fmtMoney(eventBalance(e))}.`});
    else if(st==='Reservado') items.push({t:'warn', msg:`${e.code} · Reservado, saldo ${fmtMoney(eventBalance(e))} por cobrar.`});
  });
  if(!items.length) return `<div class="notice good">Todo en orden. No hay alertas activas.</div>`;
  return items.slice(0,8).map(i=>`<div class="notice ${i.t}">${esc(i.msg)}</div>`).join('');
}

function calendarView(){
  const y = calDate.getFullYear(), m = calDate.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  
  const cells=[];
  for(let i=0; i<(firstDay===0?6:firstDay-1); i++){
    cells.push(`<div class="day out"></div>`);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = S.events.filter(e=>e.eventDate===dStr && eventState(e)!=='Cancelada');
    const isToday = dStr===todayStr() ? ' today' : '';
    cells.push(`
      <div class="day${isToday}">

        ${evs.map(e=>`<button class="calevent ${eventState(e)==='Pagado'||eventState(e)==='Finalizado'?'':'warn'}" onclick="openEventDetail('${e.id}')" title="${esc(e.code)} - ${esc(clientName(e.clientId))}"><b>${esc(e.code)}</b> ${esc(clientName(e.clientId))}</button>`).join('')}
      </div>`);
  }

  return `
  <div class="head"><div><div class="eyebrow">Agenda</div><h1>Calendario de eventos</h1><p>Visualiza los eventos programados por día y mes.</p></div>
    <div class="actions">

      ${cells.join('')}
    </div>
  </div>`;
}

  if(id){

    if(idx>=0) S.clients[idx] = Object.assign(S.clients[idx], data);

    S.clients.push({id:'cli_'+uid(), ...data});

  save(); closeModal(); render(); showToast('Cliente guardado con éxito.');

  S.clients = S.clients.filter(c=>c.id!==id);
  save(); closeModal(); render(); showToast('Cliente eliminado.');
}

}
function renderPkgLinesTable(){
  const tbody = $('#pkgLinesBody');
  if(!tbody) return;
  tbody.innerHTML = window.currentPkgLines.map((l,idx)=>`
    <tr>
      <td><input type="text" value="${esc(l.label)}" oninput="window.currentPkgLines[${idx}].label=this.value"></td>
      <td><input type="number" min="0" step="1" value="${l.qty}" oninput="window.currentPkgLines[${idx}].qty=Number(this.value); updatePkgSubtotals()"></td>
      <td><input type="number" min="0" step="0.01" value="${l.unitPrice}" oninput="window.currentPkgLines[${idx}].unitPrice=Number(this.value); updatePkgSubtotals()"></td>
      <td class="money" id="pkgSub_${idx}">${fmtMoney(l.qty*l.unitPrice)}</td>
      <td><button class="small danger" type="button" onclick="window.currentPkgLines.splice(${idx},1); renderPkgLinesTable()">✕</button></td>
    </tr>`).join('');
  updatePkgSubtotals();
}
function updatePkgSubtotals(){
  let tot = 0;
  window.currentPkgLines.forEach((l,idx)=>{
    const sub = round(Number(l.qty||0)*Number(l.unitPrice||0));
    tot += sub;
    const el = $(`#pkgSub_${idx}`);
    if(el) el.textContent = fmtMoney(sub);
  });
  const totEl = $('#pkgTotalDisplay');
  if(totEl) totEl.textContent = fmtMoney(tot);
}
function submitPackageForm(id){
  const name = $('#pkgName').value.trim();
  const capacity = Number($('#pkgCapacity').value);
  const description = $('#pkgDesc').value.trim();
  if(!name) return alert('El nombre del paquete es obligatorio.');
  if(capacity<1) return alert('La capacidad debe ser mayor a 0.');

  const lines = window.currentPkgLines.map(l=>({
    label:l.label.trim()||'Ítem sin nombre',
    qty:Math.max(0, Number(l.qty)||0),
    unitPrice:Math.max(0, Number(l.unitPrice)||0)
  }));

  if(id){
    const idx = S.packages.findIndex(x=>x.id===id);
    if(idx>=0) S.packages[idx] = {id, name, capacity, description, lines};
  } else {
    S.packages.push({id:'pkg_'+uid(), name, capacity, description, lines});
  }
  save(); closeModal(); render(); showToast('Paquete actualizado correctamente.');
}
function deletePackage(id){
  if(!confirm('¿Eliminar este tipo de paquete?')) return;
  S.packages = S.packages.filter(p=>p.id!==id);
  save(); closeModal(); render(); showToast('Paquete eliminado.');
}

        <thead><tr><th style="width:40px">Incl.</th><th>Descripción</th><th style="width:80px">Cant.</th><th style="width:100px" class="money">P. Unit.</th><th class="money">Subtotal</th><th style="width:50px"></th></tr></thead>

              <td class="money" id="evSub_${idx}">${fmtMoney(l.qty*l.unitPrice)}</td>
              <td><button class="small danger" type="button" onclick="window.currentEventLines.splice(${idx},1); renderEventLinesTable()">✕</button></td>

        <div class="summaryline"><span>Subtotal:</span><span id="evSumSub">${fmtMoney(sum(window.currentEventLines.filter(l=>l.included!==false).map(l=>l.qty*l.unitPrice)))}</span></div>

      <button onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="submitEventForm('${id}')">Guardar evento</button>
    </div>`);
  updateEventTotalsCalc();
}
function onEventPackageChange(pkgId){
  const pkg = packageById(pkgId);
  if(pkg){
    window.currentEventLines = JSON.parse(JSON.stringify(pkg.lines.map(l=>({...l, included:true}))));
    $('#eventModalGuests') && ($('#eventModalGuests').value = pkg.capacity);
  } else {
    window.currentEventLines = [];
  }
  renderEventLinesTable();
}
function renderEventLinesTable(){
  const tbody = $('#eventLinesBody');
  if(!tbody) return;
  tbody.innerHTML = window.currentEventLines.map((l,idx)=>`
    <tr>
      <td><input type="checkbox" ${l.included!==false?'checked':''} onchange="window.currentEventLines[${idx}].included=this.checked; updateEventTotalsCalc()"></td>
      <td><input type="text" value="${esc(l.label)}" oninput="window.currentEventLines[${idx}].label=this.value"></td>
      <td><input type="number" min="0" step="1" value="${l.qty}" oninput="window.currentEventLines[${idx}].qty=Number(this.value); updateEventTotalsCalc()"></td>
      <td><input type="number" min="0" step="0.01" value="${l.unitPrice}" oninput="window.currentEventLines[${idx}].unitPrice=Number(this.value); updateEventTotalsCalc()"></td>
      <td class="money" id="evSub_${idx}">${fmtMoney(l.qty*l.unitPrice)}</td>
      <td><button class="small danger" type="button" onclick="window.currentEventLines.splice(${idx},1); renderEventLinesTable()">✕</button></td>
    </tr>`).join('');
  updateEventTotalsCalc();
}
function updateEventTotalsCalc(){
  let sub = 0;
  window.currentEventLines.forEach((l,idx)=>{
    const s = l.included!==false ? round(Number(l.qty||0)*Number(l.unitPrice||0)) : 0;
    if(l.included!==false) sub += s;
    const el = $(`#evSub_${idx}`);
    if(el) el.textContent = fmtMoney(round(Number(l.qty||0)*Number(l.unitPrice||0)));
  });
  const discInput = document.querySelector('input[name="discount"]');
  const discPct = discInput ? Number(discInput.value)||0 : 0;
  const discAmt = sub * discPct / 100;
  const total = round(sub - discAmt);

  if($('#evSumSub')) $('#evSumSub').textContent = fmtMoney(sub);
  if($('#evSumDisc')) $('#evSumDisc').textContent = fmtMoney(discAmt);
  if($('#evSumTotal')) $('#evSumTotal').textContent = fmtMoney(total);
}
function submitEventForm(id){
  const form = $('#eventForm');
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  if(!data.clientId) return alert('Debe seleccionar un cliente.');
  if(!data.code.trim()) return alert('El código de evento es obligatorio.');

  const lines = window.currentEventLines.map(l=>({
    label:l.label.trim()||'Ítem sin nombre',
    qty:Math.max(0, Number(l.qty)||0),
    unitPrice:Math.max(0, Number(l.unitPrice)||0),
    included:l.included!==false
  }));

  const payload = {
    code:data.code.trim(),
    clientId:data.clientId,
    packageId:data.packageId||'',
    eventDate:data.eventDate,
    guests:Number(data.guests)||100,
    discount:Number(data.discount)||0,
    lines
  };

  if(id){
    const idx = S.events.findIndex(x=>x.id===id);
    if(idx>=0) S.events[idx] = Object.assign(S.events[idx], payload);
  } else {
    S.events.push({id:'ev_'+uid(), ...payload});
  }
  save(); closeModal(); render(); showToast('Evento guardado correctamente.');
}
function deleteEvent(id){
  if(!confirm('¿Eliminar este evento?')) return;
  S.events = S.events.filter(e=>e.id!==id);
  S.payments = S.payments.filter(p=>p.eventId!==id);
  save(); closeModal(); render(); showToast('Evento eliminado.');
}

            </select>
          </div>
          <div><label>Monto a pagar (${S.settings.currency})</label><input type="number" name="amount" min="0.01" step="0.01" required></div>
          <div><label>Fecha de pago</label><input type="date" name="date" required value="${todayStr()}"></div>
          <div><label>Método de pago</label>
            <select name="method">
              <option>Efectivo</option>
              <option>Transferencia BCP / QR Yape</option>
              <option>Tarjeta de crédito</option>
              <option>Depósito bancario</option>
            </select>
          </div>
          <div><label>Nº de recibo / Transacción</label><input type="text" name="code" value="REC-${uid().slice(-4).toUpperCase()}"></div>
        </div>
      </form>
    </div>
    <div class="modalfoot">
      <button onclick="closeModal()">Cancelar</button>
      <button class="primary" form="payForm">Registrar pago</button>
    </div>`);
}
function openPaymentModalForEvent(eventId){
  closeModal();
  const ev = eventById(eventId);
  if(!ev) return;
  const balance = eventBalance(ev);
  showModal(`
    <div class="modalhead"><h2>Registrar Pago para ${esc(ev.code)}</h2><button class="small ghost" onclick="closeModal()">✕</button></div>
    <div class="modalbody">
      <form id="payForm" onsubmit="submitPayment(event)">
        <input type="hidden" name="eventId" value="${eventId}">
        <div class="fields">
          <div><label>Monto a pagar (${S.settings.currency})</label><input type="number" name="amount" min="0.01" max="${balance}" step="0.01" required value="${balance}"></div>
          <div><label>Fecha de pago</label><input type="date" name="date" required value="${todayStr()}"></div>
          <div><label>Método de pago</label>
            <select name="method">
              <option>Efectivo</option>
              <option>Transferencia BCP / QR Yape</option>
              <option>Tarjeta de crédito</option>
              <option>Depósito bancario</option>
            </select>
          </div>
          <div><label>Nº de recibo</label><input type="text" name="code" value="REC-${uid().slice(-4).toUpperCase()}"></div>
        </div>
      </form>
    </div>
    <div class="modalfoot">
      <button onclick="openEventDetail('${eventId}')">Volver</button>
      <button class="primary" form="payForm">Registrar pago</button>
    </div>`);
}
function submitPayment(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd.entries());
  data.amount = Number(data.amount);
  if(data.amount<=0) return alert('El monto debe ser mayor a 0.');
  
  S.payments.push({id:'pay_'+uid(), void:false, ...data});
  save(); closeModal(); render(); showToast('Pago registrado con éxito.');
}
function voidPayment(id){
  if(!confirm('¿Anular este pago?')) return;
  const p = S.payments.find(x=>x.id===id);
  if(p) p.void = true;
  save(); render(); showToast('Pago anulado.');
}

// --- Configuración y Tema ---
function openSettings(){
  showModal(`
    <div class="modalhead"><h2>Configuración del Sistema</h2><button class="small ghost" onclick="closeModal()">✕</button></div>
    <div class="modalbody">
      <form id="settingsForm" onsubmit="saveSettings(event)">
        <div class="fields">
          <div><label>Nombre de la empresa</label><input type="text" name="company" required value="${esc(S.settings.company)}"></div>
          <div><label>Moneda</label><input type="text" name="currency" required value="${esc(S.settings.currency)}"></div>
          <div><label>Prefijo de códigos de evento</label><input type="text" name="prefix" required value="${esc(S.settings.prefix)}"></div>
          <div><label>Porcentaje de seña / reserva (%)</label><input type="number" name="depositPct" min="0" max="100" required value="${S.settings.depositPct}"></div>
        </div>
      </form>
    </div>
    <div class="modalfoot">
      <button onclick="closeModal()">Cancelar</button>
      <button class="primary" form="settingsForm">Guardar cambios</button>
    </div>`);
}
function saveSettings(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  S.settings = Object.assign(S.settings, Object.fromEntries(fd.entries()));
  save(); closeModal(); render(); showToast('Configuración guardada.');
}
function toggleTheme(){
  S.settings.theme = S.settings.theme==='dark' ? 'light' : 'dark';
  save(); render();
}

// Inicialización
function setQuery(val){query=val; render();}
render();
</script>
